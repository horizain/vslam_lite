# ============================================================
# 机器人定位配置（M0.3 Localizer Facade）
# PRODUCTION_LOCALIZATION_PLAN §4.1 / §4.3
# 生产地图模式要求双目或 VIO 提供公制尺度；纯单目仅用于教学/诊断。
# ============================================================

Robot:
  # 运行模式（§1.3）：OdometryOnly / Mapping / LocalizationOnly / MapMaintenance
  mode: LocalizationOnly

  # 相机 -> 机器人基座 固定标定（§2 T_bc，不允许因回环跳变）
  # 平移：相机光心在基座系中的位置（米）
  # 四元数：xyzw；归一化误差 < 1e-6（§4.3，构造时校验，不静默归一化）
  T_bc:
    translation: [0.0, 0.0, 0.0]
    quaternion: [0.0, 0.0, 0.0, 1.0]

  # 双目时间差初值上限（秒）（§4.3）
  stereo_max_time_diff_s: 0.001

  # M2.1（§6.1/§6.2）：实时调度首版参数
  Runtime:
    # 异步输入：传感器回调只校验并入队（跟踪 worker 消费），满丢最旧、保最新。
    # false = M0 同步路径（processFrame 直接驱动 VO）
    enable_async_input: false
    # 输入队列固定容量（ring buffer）
    input_queue_capacity: 3
    # 跟踪硬期限（10 Hz 地面机器人；20 Hz 平台改为 40）
    tracking_deadline_ms: 80
    # 预测外推最长时长（超过后 pose_valid=false）
    prediction_timeout_ms: 500
    # 后台任务最大年龄（超出视为陈旧，由 stale gate 丢弃）
    max_backend_task_age_ms: 500
    # 关闭时限（join 所有线程）
    shutdown_timeout_ms: 2000

  # M2.2（§6.2）：地图资源硬预算（2026-08-10 按 KITTI 00 实测标定：
  # 原 1200/120000/900 与 §6.5 RSS <1GiB 硬门槛互斥——12 万点实测
  # RSS≈1.3GB；标定依据与常量见 resource_budget.h，§3.38 记录）
  MapBudget:
    # 活动关键帧 / 地图点上限（§6.3 第 4/6 步触发回收与停止建图）
    max_active_keyframes: 700
    max_active_points: 60000
    # 描述子 / 在途 Local BA 快照 / 总量估算上限（MiB）
    max_descriptor_mb: 256
    max_snapshot_mb: 256
    max_total_estimated_mb: 500
