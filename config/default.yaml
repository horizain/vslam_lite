# ============================================================
# VSLAM 默认配置文件
# ============================================================

# ---- 相机内参 ----
Camera:
  fx: 718.856
  fy: 718.856
  cx: 607.193
  cy: 185.216
  width: 1241
  height: 376
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0

# ---- 特征参数 ----
Feature:
  num_features: 1000       # 每帧提取的 ORB 特征数
  scale_factor: 1.2        # 金字塔尺度因子
  pyramid_levels: 8        # 金字塔层数
  orb_max_bands: 4         # ORB 外层并行分带上限；1=单带。与 opencv_threads 配套收敛
                           # TBB 嵌套并行度（带×octave 任务成倍放大，超订无益，见 §3.16）
  match_ratio: 0.7         # 最近邻/次近邻比率测试阈值
  ransac_threshold: 3.0    # RANSAC 重投影误差阈值

# ---- 运行时资源参数 ----
Runtime:
  opencv_threads: 16       # OpenCV/TBB 线程数。0=库默认（=全部逻辑核，32 核机器实测进程
                           # 63 线程、超订无益）；设物理核数（本机 16）实测 FPS 最高且线程
                           # 减到 47（§3.16 A/B）；移动端建议 2~4
  async_backend: true      # M6：Committer 追加 rebase 协议完成后恢复默认开启
                           # （Local BA/回环后台执行，前端只跟踪；§3.16 收益
                           # FPS+23%/LOST-97%，M1-M6 事务式写回兜底）。
                           # §3.15 曾因"BA 滞后致前端用陈旧点、LOST +130%"默认关闭；
                           # §3.16 覆盖式队列 + 跳过活动参考帧写回后净收益转正：
                           # 历史性能实验曾有 FPS +23%，但异步回环快照可能与前端新增
                           # KF/点交错；在 generation/rebase 完成并全程 A/B 前不作为默认。

# ---- VO 参数 ----
VO:
  method: 0                # 0 = ORB匹配, 1 = LK光流
  min_parallax: 0.1        # 初始化的最小视差
  min_matches_init: 100    # 初始化的最小匹配数
  min_matches_track: 20    # 跟踪的最小匹配数
  pnp_min_inliers: 15      # PnP 最小内点数
  pnp_min_inlier_ratio: 0.3 # PnP 最小内点比例
  pnp_max_rmse: 2.5        # PnP 内点最大重投影 RMSE（像素）
  max_tracking_failures: 5 # 连续跟踪失败多少帧后进入重定位
  max_relocalize_frames: 20 # 重定位持续失败多少帧后建立新子地图
  max_frame_translation: 3.0 # 双目相邻有效帧最大平移（米）
  max_frame_rotation: 0.35 # 双目相邻有效帧最大旋转（弧度）
  keyframe_translation: 0.5  # 关键帧选择：最小平移距离（米）
  keyframe_rotation: 0.2   # 关键帧选择：最小旋转角度（弧度）
  keyframe_min_inliers: 15 # 内点不足时补关键帧
  min_keyframe_interval: 10 # 弱匹配触发关键帧的最小间隔
  max_keyframe_interval: 15 # 最长关键帧间隔，防止参考帧过旧
  keyframe_max_count: 1800       # KF 规模硬顶：超过后平移阈值放大 1.5 倍

# ---- 优化参数 (Phase 1) ----
Optimizer:
  local_window_size: 10    # 局部 BA 窗口大小
  local_ba_iterations: 10  # 局部 BA 迭代次数
  enable_local_ba: true    # 局部 BA 开关（false 时仅前端跟踪，用于对比实验）
  global_ba_iterations: 0  # M4 暂关：sampled-GBA 与锚定轨迹锯齿不兼容，M6 COW 后恢复（原 20）

# ---- 回环检测 (Phase 2) ----
LoopClosure:
  enable_loop_closure: true   # run_slam 默认开；run_vo 入口强制关闭（A/B 对比）
  vocab_path: "config/ORBvoc.dbow3"  # 词袋词典（scripts/fetch_vocab.sh 获取）
  min_score: 0.1              # 词袋候选最低分（0.3 召回过低；0.1 + PnP 验证兜底）
  temporal_window: 30         # 跳过最近 N 个关键帧（时间过滤，刚走过的路不算回环）
  detection_interval: 10      # 每 N 个关键帧检测一次回环
  pnp_inlier_ratio: 0.85      # 几何验证最小内点比例（提高，过滤弱验证）
  min_loop_inliers: 50        # 几何验证最小内点数（提高，过滤弱验证）
  loop_cooldown_kfs: 20       # 回环校正冷却（关键帧数）：挡同区域重复命中
  top_candidates: 20          # 词袋查询候选数（Top-N，提高召回）
  position_prior_dist: 40.0   # 位置先验距离阈值(m)：轨迹自交区域词袋分低时补召回
  position_prior_gap: 100     # 位置先验最小关键帧间隔（防刚走过的路误报）

# ---- 可视化 ----
Viewer:
  enabled: true
  camera_size: 0.1         # 相机位姿显示尺寸
  point_size: 2            # 地图点显示尺寸
  trajectory_color: [0.0, 0.8, 1.0]  # 轨迹颜色 (RGB)

# ---- 双目参数 ----
Stereo:
  baseline: 0.54          # 基线（米）。KITTI 序列 ≈ 0.54m（由 calib.txt P1[0][3] = -fx*baseline 反推）
  min_depth: 0.5          # 有效深度下限（米），过近视差噪声大
  max_depth: 35.0         # 位姿估计深度上限（米），远点视差误差会放大为米级深度误差
  min_points: 40          # 初始化/3D-3D 所需最少有效双目点
  rigid_min_inliers: 15   # 3D-3D 最少 RANSAC 内点
  rigid_min_inlier_ratio: 0.5 # 3D-3D 最小内点比例
  rigid_ransac_threshold: 0.25 # 3D-3D RANSAC 距离阈值（米）
  rigid_max_rmse: 0.25    # Kabsch 刚体拟合最大 RMSE（米）
  keyframe_translation: 0.9  # 双目关键帧最小平移（米）。双目有绝对尺度，单帧即可建点；
                             # 阈值过大 → ref 间隔远 → 高速段 ORB 匹配骤减会 LOST；
                             # 阈值过小 → 每帧插 KF → 地图膨胀 + BA 空转
